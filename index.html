【时长】XX分钟
【动作】
1. 动作名 - 次数/时长
2. 动作名 - 次数/时长
3. ...
【视频】B站/小红书搜索关键词

=====DAY=====

【周二】
（同上格式）

请直接输出。`
    }
  };

  const cfg = prompts[type];
  const existing = getExistingList(type);
  let input, filters = { timeRange: 'any', reliability: 'verified', explicitName: true };
  const modalResult = await openAIInputModal(cfg, defaultValue || '');
  if (modalResult === null || modalResult === undefined) return;
  input = modalResult.input || '';
  filters = modalResult.filters || filters;

  // ===== 生成方式：AI 检索 / 联网检索（可单选或组合） =====
  let useAI = !!(filters.useAI);
  let useWeb = !!(filters.useWeb);
  if (!useAI && !useWeb) {
    toast('请至少选择一种生成方式（AI 检索 或 联网检索）', 'error');
    return;
  }
  // 模型自带联网（如 GLM web_search）：用户只勾「联网检索」时，自动改用模型原生联网完成检索+生成，
  // 避免走易失败的独立检索源（维基 / SearXNG 公共实例在部分网络下不可达）
  const modelHasNativeWeb = !!(api.nativeWeb && /bigmodel\.cn/i.test(api.url || ''));
  if (!useAI && useWeb && modelHasNativeWeb) { useAI = true; useWeb = false; }

  // 联网检索：开启时先检索真实资料
  let searchSources = [];
  let searchBlock = '';
  if (useWeb) {
    const searchCfg = normalizeSearchCfg(STORAGE.get('search'));
    const defaultQueryMap = {
      case: '2025 品牌营销案例 复盘 策略',
      trend: '2025 行业趋势 报告 分析',
      ent: '2025 文娱 成功案例 复盘',
      ai: 'AI 行业 最新动态 2025'
    };
    const searchQuery = input || defaultQueryMap[type] || cfg.label;
    const providerLabel = (searchCfg.providers || []).map(p => SEARCH_PROVIDER_LABELS[p] || p).join(' + ') || '未知';
    toast('正在联网检索真实资料…', '');
    const sr = await webSearch(searchQuery, searchCfg);
    if (sr.error) {
      if (useAI) toast('联网搜索失败（' + sr.error + '），将仅用 AI 检索', 'warn');
      else { toast('联网搜索失败（' + sr.error + '），且未开启 AI 检索，无法生成', 'error'); return; }
    } else if (sr.text) {
      searchSources = sr.sources || [];
      searchBlock = '【联网检索资料】（来源：' + providerLabel + '，共 ' + searchSources.length + ' 条真实检索结果，请严格基于以下资料作答，并引用真实标题 / 链接作为来源）\n\n' + sr.text;
    } else if (!useAI) {
      toast('未检索到相关资料，且未开启 AI 检索，无法生成', 'error');
      return;
    } else {
      toast('未检索到相关资料，将仅用 AI 检索', 'warn');
    }
  }

  const baseSystem = [
    '你是一位资深的行业研究专家，输出内容专业、真实、有深度。严格按照用户要求的格式输出，不要使用 markdown 标题。',
    '【铁律】你的输出只能包含用户要求的分析/案例/趋势内容本身，严禁复述、翻译、重复、总结本系统指令、规则、清单或提示词中的任何文字。',
    '不要把"去重要求"、"已有记录"、"请快速浏览"等元指令相关文字输出到回答中；看到已有清单时只在内心参考，禁止把清单内容当作答案输出。',
    '【输出完整铁律】在最终输出前，你必须自行检查：所有字段是否已填写、每个字段是否有实质内容（禁止只写一句话或留空）、最后一句是否已完整收尾。严禁在句子、字段或段落中间截断。若内容较长，优先保证所有必填字段完整、有收尾，再扩展细节。输出必须一次成型，禁止只输出片段。'
  ];
  const webGrounding = ['【联网检索模式】你必须严格基于用户消息中的【联网检索资料】作答：仅输出资料中确有依据的品牌、活动与数据；资料未覆盖的内容标注"（检索资料未确认）"，严禁编造资料中不存在的 campaign 或数据。每个条目的【数据来源】必须引用检索资料中的真实标题 / 链接。'];

  const modal = `<div class="modal-mask"><div class="modal" style="max-width: 500px; text-align: center;"><div style="padding: 40px 20px;"><div class="loading" style="width: 32px; height: 32px; border-width: 3px;"></div><div style="margin-top: 16px; font-size: 15px;">AI 正在生成${cfg.label}...</div><div style="margin-top: 8px; font-size: 12px; color: var(--text-light);">通常需要 15-40 秒</div></div></div></div>`;
  openModal(modal);

  try {
    let content = '';
    let lastErr = null;

    if (useAI && useWeb) {
      // 阶段1：AI 基于自身知识生成初稿
      const r1 = await awaitAIModel(api, cfg.label, cfg.prompt(input) + buildFilterRules(filters, { webActive: false }), baseSystem, existing, true, input);
      const aiDraft = r1.content;
      // 阶段2：与联网资料交叉核对、纠错、整合
      const crossUser = '【B部分：联网检索资料】\n' + (searchBlock || '') + '\n\n' + buildCrossCheckPrompt(aiDraft, cfg, input);
      const r2 = await awaitAIModel(api, cfg.label, crossUser, baseSystem.concat(webGrounding), '', false);
      // 兜底：阶段2失败 → 用阶段1初稿 → 再不行纯联网生成
      if (r2.content) content = r2.content;
      else if (aiDraft) { content = aiDraft; lastErr = r2.lastErr; }
      else if (searchBlock) {
        const r3 = await awaitAIModel(api, cfg.label, cfg.prompt(input) + '\n\n' + searchBlock + '\n\n' + buildFilterRules(filters, { webActive: true }), baseSystem.concat(webGrounding), existing, true);
        content = r3.content; lastErr = r3.lastErr;
      } else { lastErr = r2.lastErr; }
      if (!lastErr && (r1.lastErr || r2.lastErr)) lastErr = r2.lastErr || r1.lastErr;
    } else if (useAI && !useWeb) {
      const r = await awaitAIModel(api, cfg.label, cfg.prompt(input) + buildFilterRules(filters, { webActive: false }), baseSystem, existing, true, input);
      content = r.content; lastErr = r.lastErr;
    } else if (!useAI && useWeb) {
      const r = await awaitAIModel(api, cfg.label, cfg.prompt(input) + '\n\n' + searchBlock + '\n\n' + buildFilterRules(filters, { webActive: true }), baseSystem.concat(webGrounding).concat(['优先基于上方【联网检索资料】作答并引用真实出处；若检索资料不足以覆盖全部要求（如缺少第 2 条案例），允许用你自身知识补充，但补充内容必须明确标注"（推测/资料未确认）"，且仍须输出完整结构，严禁整段留白或仅回复"无法生成"。']), existing, true);
      content = r.content; lastErr = r.lastErr;
    }

    // 拒绝式 / 空泛输出兜底：内容非空但实为拒绝时，降级重生成一次（放宽约束、去严格联网限制）
    if (content && looksLikeRefusal(content)) {
      console.log('检测到 AI 输出疑似拒绝/空泛，降级重生成一次…');
      const retryR = await awaitAIModel(
        api, cfg.label,
        cfg.prompt(input) + buildFilterRules(Object.assign({}, filters, { reliability: 'speculative' }), { webActive: false }),
        baseSystem, existing, true, useAI ? input : undefined
      );
      if (retryR.content && !looksLikeRefusal(retryR.content)) {
        content = retryR.content;
        console.log('降级重生成成功，新长度：', content.length);
      } else {
        console.log('降级重生成仍为空泛，保留原输出由后续截断检查处理');
      }
    }

    if (!content) {
      const msg = lastErr ? (lastErr.message || String(lastErr)) : 'AI 两次都返回了空响应（已尝试 content / text / 顶层字段 / 整树扫描）。当前模型：' + (api.model || '默认') + '。请打开浏览器控制台（F12）把那段『AI 完整原始响应』截图发我，我据此适配你的代理返回结构。';
      console.log('AI 生成最终失败：', msg);
      throw new Error(msg);
    }
    console.log('AI 返回内容长度：', content.length, '字符');
    console.log('AI 返回内容前 200 字：', content.slice(0, 200));
    // 输出完整性检查：若被截断，自动续写一次补全
    if (isOutputTruncated(content, type)) {
      console.log('检测到 AI 输出可能截断，发起续写补全…');
      const cont = await continueAIOutput(api, cfg.label, content, baseSystem, input);
      if (cont && cont.trim().length > 10) {
        content = content.trim() + '\n\n' + cont.trim();
        content = content.replace(/\n{3,}/g, '\n\n');
        console.log('续写补全后总长度：', content.length);
      } else {
        console.log('续写未返回有效内容，保留原输出');
      }
    }
    closeModal();
    window.__lastAIGeneratedRaw = content;
    parseAndSave(type, content, input, searchSources);
  } catch (e) {
    const msg = (e && e.message) ? e.message : String(e);
    const isFetchFail = /Failed to fetch|NetworkError|network|跨域|CORS/i.test(msg);
    const hint = isFetchFail
      ? '常见原因：<br>① API 地址没填完整（必须以 <code>/chat/completions</code> 结尾）<br>② 用 <code>file://</code> 直接打开页面导致浏览器跨域拦截——请改用 <code>http://localhost:8090</code> 访问<br>③ 设备未联网或被代理拦截'
      : '常见原因：<br>① DeepSeek 余额不足 / 额度用尽（HTTP 402）<br>② API Key 错误或已失效（HTTP 401）<br>③ 模型名称不存在（HTTP 404，可在设置里把模型改为 <code>deepseek-chat</code> 试试）';
    const errHtml = `<div class="modal-mask"><div class="modal" style="max-width: 480px;">
      <div class="modal-header"><div class="modal-title">AI 生成失败</div></div>
      <div style="background: var(--red-light); color: var(--red); border-radius: 10px; padding: 12px 14px; font-size: 13px; line-height: 1.6; word-break: break-all; margin-bottom: 12px; white-space: pre-wrap;">${escapeHtml(msg)}</div>
      <div style="font-size: 13px; color: var(--text-light); line-height: 1.8; margin-bottom: 16px;">${hint}</div>
      <div style="display:flex; gap:8px; justify-content:flex-end;">
        <button class="btn btn-ghost" id="errRetry">重试</button>
        <button class="btn btn-cream" id="errSettings">去设置检查</button>
      </div>
    </div></div>`;
    document.getElementById('modalContainer').innerHTML = errHtml;
    const mask = document.querySelector('#modalContainer .modal-mask');
    if (mask) mask.addEventListener('click', (e) => { if (e.target === mask) closeModal(); });
    const r = document.getElementById('errRetry'); if (r) r.onclick = () => { closeModal(); aiGenerate(type, input); };
    const s = document.getElementById('errSettings'); if (s) s.onclick = () => { closeModal(); switchSection('settings'); };
  }
}

// 解析 + 直接保存（不再弹表单）
function parseAndSave(type, content, input, searchSources) {
  if (type === 'case') {
    let parts = content.split(/=====\s*案例\s*2\s*=====/i);
    if (parts.length === 1) parts = content.split(/【案例\s*2】/i);
    if (parts.length === 1) parts = content.split(/案例\s*2\s*[：:\n]/i);
    const parsed = [];
    const placeholderRe = /^(（[^（）]*?）|\([^()]*?\)|核心策略|传播渠道|效果数据|值得学习|暂无数据|请填写|示例|模板)$/;
    parts.forEach((part) => {
      part = part.trim();
      if (!part) return;
      let s = extractSections(part, ['品牌', '行业', '标题', '策略', '渠道', '活动效果', '学习要点', '我的笔记', '数据来源']);
      // 容错 1：方括号格式失败，尝试更宽松的"标签：内容"格式
      if (!s['品牌'] && !s['标题']) {
        const keys = ['品牌', '行业', '标题', '策略', '渠道', '活动效果', '学习要点'];
        const aliases = {
          '品牌': ['品牌', '品牌名', '品牌名称'],
          '行业': ['行业', '所属行业', '领域'],
          '标题': ['标题', '案例标题', '活动名称', '活动名'],
          '策略': ['策略', '营销策略', '核心打法', '核心策略'],
          '渠道': ['渠道', '传播渠道', '传播路径'],
          '活动效果': ['活动效果', '效果', '效果数据'],
          '学习要点': ['学习要点', '要点', '值得学习', '我的笔记']
        };
        const aliasRe = (k) => new RegExp(aliases[k].map(a => a.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')).join('|'));
        // 先尝试匹配 【key】 内容（不含下一个【key】）
        const bracketPattern = /【(\S+?)】([\s\S]+?)(?=【\S+?】|$)/g;
        let m;
        while ((m = bracketPattern.exec(part)) !== null) {
          const segKey = m[1].trim();
          const segVal = m[2].trim();
          if (!segKey || !segVal) continue;
          for (const k of keys) {
            if (aliasRe(k).test(segKey) && !s[k]) { s[k] = segVal; break; }
          }
        }
        // 再尝试 key: value / key：value
        if (!s['品牌'] && !s['标题']) {
          const colonPattern = /(\S+?)\s*[：:]\s*([\s\S]+?)(?=\S{1,20}\s*[：:]|$)/g;
          while ((m = colonPattern.exec(part)) !== null) {
            const segKey = m[1].trim();
            const segVal = m[2].trim();
            if (!segKey || !segVal) continue;
            for (const k of keys) {
              if (aliasRe(k).test(segKey) && !s[k]) { s[k] = segVal; break; }
            }
          }
        }
      }
      // 清洗：去掉模板占位文字（如"（核心策略 2-3 点）"）
      Object.keys(s).forEach(k => {
        const v = s[k].trim();
        if (placeholderRe.test(v) || v.replace(/[（）()\s]/g, '').length < 4) s[k] = '';
      });
      // 容错 2：还提取不到标题/品牌，把整个内容作为一条记录
      if (!s['品牌'] && !s['标题']) {
        const firstLine = part.split('\n').find(l => l.trim() && !l.includes('案例') && !l.includes('===')) || '';
        s['标题'] = firstLine.trim().slice(0, 50) || 'AI 生成案例';
        s['策略'] = part.slice(0, 500);
      }
      const obj = {
        id: uid(),
        brand: (s['品牌'] || '').trim(),
        industry: (s['行业'] || '').trim(),
        title: (s['标题'] || '').trim(),
        strategy: (s['策略'] || '').trim(),
        channel: (s['渠道'] || '').trim(),
        effect: (s['活动效果'] || '').trim(),
        note: (s['学习要点'] || '').trim(),
        source: (s['数据来源'] || (searchSources && searchSources.join('；')) || '').trim(),
        date: today(),
        currentStage: '学习中',
        tags: ''
      };
      if (obj.brand || obj.title) parsed.push(obj);
    });
    if (parsed.length === 0) {
      toast('AI 返回了内容但未能解析，请打开控制台(F12)查看', 'error');
      console.log('=== AI 原始返回 ===');
      console.log(content);
      if (currentSection === 'career') render();
    } else {
      openAIReviewModal(parsed, 'case', (confirmed) => {
        if (!confirmed || confirmed.length === 0) { toast('已取消保存', 'warn'); return; }
        const arr = STORAGE.get('cases', []);
        confirmed.forEach(obj => arr.unshift(obj));
        STORAGE.set('cases', arr);
        toast(`✅ 已保存 ${confirmed.length} 条品牌案例`, 'success');
        if (currentSection === 'career') render();
      });
    }
  } else if (type === 'ent') {
    let parts = content.split(/=====\s*案例\s*2\s*=====/i);
    if (parts.length === 1) parts = content.split(/【案例\s*2】/i);
    if (parts.length === 1) parts = content.split(/案例\s*2\s*[：:\n]/i);
    const parsed = [];
    parts.forEach((part) => {
      part = part.trim();
      if (!part) return;
      let s = extractSections(part, ['主体', '行业', '标题', '策略', '渠道', '成效', '学习要点', '数据来源']);
      if (!s['主体'] && !s['标题']) {
        const keys = ['主体', '行业', '标题', '策略', '渠道', '成效', '学习要点'];
        const aliases = {
          '主体': ['主体', '平台', '公司', '品牌', '品牌名', '品牌名称', '作品', '作品名'],
          '行业': ['行业', '所属行业', '领域', '细分行业'],
          '标题': ['标题', '案例标题', '活动名称', '活动名', '作品名'],
          '策略': ['策略', '营销策略', '核心打法', '核心策略', '成功策略'],
          '渠道': ['渠道', '传播渠道', '传播路径', '传播平台', '平台'],
          '成效': ['成效', '活动效果', '效果', '效果数据', '成效数据', '影响'],
          '学习要点': ['学习要点', '要点', '值得学习', '我的笔记']
        };
        const aliasRe = (k) => new RegExp(aliases[k].map(a => a.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')).join('|'));
        const pattern = /(\S+?)\s*[：:]\s*([\s\S]+?)(?=\S{1,20}\s*[：:]|$)/g;
        let m;
        while ((m = pattern.exec(part)) !== null) {
          const segKey = m[1].trim();
          const segVal = m[2].trim();
          if (!segKey || !segVal) continue;
          for (const k of keys) {
            if (aliasRe(k).test(segKey) && !s[k]) { s[k] = segVal; break; }
          }
        }
      }
      if (!s['主体'] && !s['标题']) {
        const firstLine = part.split('\n').find(l => l.trim() && !l.includes('案例') && !l.includes('===')) || '';
        s['标题'] = firstLine.trim().slice(0, 50) || 'AI 生成文娱案例';
        s['策略'] = part.slice(0, 500);
      }
      const obj = {
        id: uid(),
        brand: (s['主体'] || '').trim(),
        industry: (s['行业'] || '').trim(),
        title: (s['标题'] || '').trim(),
        strategy: (s['策略'] || '').trim(),
        channel: (s['渠道'] || '').trim(),
        effect: (s['成效'] || '').trim(),
        note: (s['学习要点'] || '').trim(),
        source: (s['数据来源'] || (searchSources && searchSources.join('；')) || '').trim(),
        date: today(),
        currentStage: '观察中',
        tags: ''
      };
      if (obj.brand || obj.title) parsed.push(obj);
    });
    if (parsed.length === 0) {
      toast('AI 返回了内容但未能解析，请打开控制台(F12)查看', 'error');
      console.log('=== AI 原始返回 ===');
      console.log(content);
      if (currentSection === 'career') render();
    } else {
      openAIReviewModal(parsed, 'ent', (confirmed) => {
        if (!confirmed || confirmed.length === 0) { toast('已取消保存', 'warn'); return; }
        const arr = STORAGE.get('ent', []);
        confirmed.forEach(obj => arr.unshift(obj));
        STORAGE.set('ent', arr);
        toast(`✅ 已保存 ${confirmed.length} 条文娱案例`, 'success');
        if (currentSection === 'career') render();
      });
    }
  } else if (type === 'trend') {
    let parts = content.split(/=====\s*趋势\s*2\s*=====/i);
    if (parts.length === 1) parts = content.split(/【趋势\s*2】/i);
    if (parts.length === 1) parts = content.split(/趋势\s*2\s*[：:\n]/i);
    const saved = [];
    parts.forEach((part) => {
      part = part.trim();
      if (!part) return;
      const s = extractSections(part, ['标题', '行业', '报告来源', '数据来源', '核心内容', '关键引用', '我的笔记']);
      const obj = {
        id: uid(),
        title: (s['标题'] || '').trim(),
        industry: (s['行业'] || '互联网').trim(),
        source: (s['数据来源'] || s['报告来源'] || (searchSources && searchSources.join('；')) || '').trim(),
        content: (s['核心内容'] || '').trim(),
        quote: (s['关键引用'] || '').trim(),
        note: (s['我的笔记'] || '').trim(),
        currentStage: '学习中',
        date: today()
      };
      if (obj.title) {
        const arr = STORAGE.get('trends', []);
        arr.unshift(obj);
        STORAGE.set('trends', arr);
        saved.push(obj);
      }
    });
    toast(`✅ 已生成并保存 ${saved.length} 条行业趋势`, 'success');
    if (currentSection === 'career') render();

function extractSections(text, keys) {
  const result = {};
  for (let i = 0; i < keys.length; i++) {
    const key = keys[i];
    const nextKey = keys[i + 1];
    // 匹配 【key】 后面到下一个【 或结尾
    const re = new RegExp('【' + key.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '】([\\s\\S]*?)(?=【|$)');
    const m = text.match(re);
    if (m) {
      let v = m[1].trim();
      // 如果有下一个 key，截到下一个 key 前
      if (nextKey) {
        const nextIdx = v.indexOf('【' + nextKey + '】');
        if (nextIdx >= 0) v = v.slice(0, nextIdx).trim();
      }
      result[key] = v;
    }
  }
  return result;
}

// ===== 备份 =====
function exportData() {
  const data = {};
  for (let i = 0; i < localStorage.length; i++) {
    const k = localStorage.key(i);
    if (k && k.startsWith('wb_life_')) data[k] = localStorage.getItem(k);
  }
  const json = JSON.stringify({ version: 1.1, exportedAt: new Date().toISOString(), data }, null, 2);
  const blob = new Blob([json], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `life-dashboard-backup-${today()}.json`;
  a.click();
  URL.revokeObjectURL(url);
  toast('✅ 备份已下载', 'success');
}

function importData(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (ev) => {
    try {
      const obj = JSON.parse(ev.target.result);
      const data = obj.data || obj;
      const count = Object.keys(data).length;
      confirm2('确认导入', `将导入 ${count} 个数据项，覆盖当前数据。是否继续？`, () => {
        Object.keys(data).forEach(k => { if (k.startsWith('wb_life_')) localStorage.setItem(k, data[k]); });
        toast('✅ 导入成功', 'success');
        render();
      });
    } catch (err) {
      toast('❌ 导入失败：' + err.message, 'error');
    }
  };
  reader.readAsText(file);
  e.target.value = '';
}

      const k = localStorage.key(i);
      if (k && k.startsWith('wb_life_') && k !== 'wb_life_api' && k !== 'wb_life_initialized') keys.push(k);
    }
    keys.forEach(k => localStorage.removeItem(k));

    render();
  });
}
